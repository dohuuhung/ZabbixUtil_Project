# update_mode:
# - 0: based on update function => TODO Dev in the next version
# - 1(default): like Maxigent, based on overwrite function. Delete old and then create new
update_mode: 1

items:
  - name: cpu_all_usage
    key_: system.cpu.util
    type: 7
    delay: 60s                   # delay value is interval time of collecting data from target device
    status: 0                    # 0(default): enable item, 1: disable item
    value_type: 0

events:
  - description: CPU ALL usage is High
    event_name: CPU_ALL@check_cpu_usage
    triggers:
      - expression: min(/{0}/system.cpu.util,5m)>=80 and max(/{0}/system.cpu.util,5m)<90
        priority: 2                # 0: not classified, 1: information, 2: warning, 3: average, 4: high, 5: disaster
        status: 0                  # Whether the trigger is enabled or disabled. 0: enabled, 1: disabled.
        type: 0                    # 0: (default) do not generate multiple events, 1: generate multiple events
      - expression: min(/{0}/system.cpu.util,5m)>=90 and max(/{0}/system.cpu.util,5m)<=100
        priority: 4
        status: 0
        type: 0
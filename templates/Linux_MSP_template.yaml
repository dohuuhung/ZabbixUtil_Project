# update_mode:
# - 0: based on update function => TODO Dev in the next version
# - 1(default): like Maxigent, based on overwrite function. Delete old and then create new
update_mode: 1

items:
  - name: available_memory
    key_: vm.memory.size[available]
    type: 7
    delay: 60s                   # delay value is interval time of collecting data from target device
    status: 0                    # 0(default): enable item, 1: disable item
    value_type: 0
  - name: icmp_ping
    key_: icmppingloss[,3,1000,32,2000]
    type: 7
    delay: 60s                   # delay value is interval time of collecting data from target device
    status: 0                    # 0(default): enable item, 1: disable item
    value_type: 0
  - name: available_memory_in_percentage
    key_: vm.memory.size[pavailable]
    type: 7
    delay: 60s                   # delay value is interval time of collecting data from target device
    status: 0                    # 0(default): enable item, 1: disable item
    value_type: 0
  - name: cpu_all_system_usage
    key_: system.cpu.util[,system]
    type: 7
    delay: 60s                   # delay value is interval time of collecting data from target device
    status: 0                    # 0(default): enable item, 1: disable item
    value_type: 0
  - name: cpu_all_util_usage
    key_: system.cpu.util
    type: 7
    delay: 60s                   # delay value is interval time of collecting data from target device
    status: 0                    # 0(default): enable item, 1: disable item
    value_type: 0
  - name: memory_utilization
    key_: vm.memory.utilization
    type: 7
    delay: 60s                   # delay value is interval time of collecting data from target device
    status: 0                    # 0(default): enable item, 1: disable item
    value_type: 0
  - name: swap_usage
    key_: system.swap.size[,pused]
    type: 7
    delay: 60s                   # delay value is interval time of collecting data from target device
    status: 0                    # 0(default): enable item, 1: disable item
    value_type: 0

events:
  - description: Available memory is low
    event_name: MEM@check_mem_available
    triggers:
      - expression: max(/{0}/vm.memory.size[available],5m)<20 and last(/{0}/vm.memory.size[total])>0
        priority: 2                # 0: not classified, 1: information, 2: warning, 3: average, 4: high, 5: disaster
        status: 0                  # Whether the trigger is enabled or disabled. 0: enabled, 1: disabled.
        type: 0                    # 0: (default) do not generate multiple events, 1: generate multiple events
  - description: Percentage of available memory is low
    event_name: MEM@check_mem_pavailable
    triggers:
      - expression: min(/{0}/vm.memory.size[pavailable],5m)>10 and max(/{0}/vm.memory.size[pavailable],5m)<=20
        priority: 2                # 0: not classified, 1: information, 2: warning, 3: average, 4: high, 5: disaster
        status: 0                  # Whether the trigger is enabled or disabled. 0: enabled, 1: disabled.
        type: 0                    # 0: (default) do not generate multiple events, 1: generate multiple events
      - expression: max(/{0}/vm.memory.size[pavailable],5m)<=10
        priority: 4
        status: 0
        type: 0
  - description: CPU ALL system usage is High
    event_name: CPU_ALL@check_sys_usage
    triggers:
      - expression: min(/{0}/system.cpu.util[,system],5m)>=20 and max(/{0}/system.cpu.util[,system],5m)<40
        priority: 2                # 0: not classified, 1: information, 2: warning, 3: average, 4: high, 5: disaster
        status: 0                  # Whether the trigger is enabled or disabled. 0: enabled, 1: disabled.
        type: 0                    # 0: (default) do not generate multiple events, 1: generate multiple events
      - expression: min(/{0}/system.cpu.util[,system],5m)>=40 and max(/{0}/system.cpu.util[,system],5m)<100
        priority: 4
        status: 0
        type: 0
  - description: CPU ALL system usage is High
    event_name: CPU_ALL@check_sys_usage
    triggers:
      - expression: min(/{0}/system.cpu.util,5m)>=80 and max(/{0}/system.cpu.util,5m)<90
        priority: 2                # 0: not classified, 1: information, 2: warning, 3: average, 4: high, 5: disaster
        status: 0                  # Whether the trigger is enabled or disabled. 0: enabled, 1: disabled.
        type: 0                    # 0: (default) do not generate multiple events, 1: generate multiple events
      - expression: min(/{0}/system.cpu.util,5m)>=90 and max(/{0}/system.cpu.util,5m)<=100
        priority: 4
        status: 0
        type: 0
  - description: Available memory is low
    event_name: MEM@check_mem_available
    triggers:
      - expression: (100-min(/{0}/vm.memory.utilization,5m))>=80 and (100-max(/{0}/vm.memory.utilization,5m))<90
        priority: 2                # 0: not classified, 1: information, 2: warning, 3: average, 4: high, 5: disaster
        status: 0                  # Whether the trigger is enabled or disabled. 0: enabled, 1: disabled.
        type: 0                    # 0: (default) do not generate multiple events, 1: generate multiple events
      - expression: (100-min(/{0}/vm.memory.utilization,5m))>=90 and (100-max(/{0}/vm.memory.utilization,5m))<=100
        priority: 2
        status: 0
        type: 0
  - description: Swap usage is high
    event_name: SWAPUSAGE@check_usage
    triggers:
      - expression: min(/{0}/system.swap.size[,pused],5m)>=50 and max(/{0}/system.swap.size[,pused],5m)<70
        priority: 2                # 0: not classified, 1: information, 2: warning, 3: average, 4: high, 5: disaster
        status: 0                  # Whether the trigger is enabled or disabled. 0: enabled, 1: disabled.
        type: 0                    # 0: (default) do not generate multiple events, 1: generate multiple events
      - expression: min(/{0}/system.swap.size[,pused],5m)>=70 and max(/{0}/system.swap.size[,pused],5m)<=100
        priority: 2
        status: 0
        type: 0